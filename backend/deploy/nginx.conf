# Optional nginx reverse proxy -- NOT required for the actual deployment
# target described in the brief (frontend on Vercel, backend on Render,
# both of which terminate TLS and route traffic themselves). This exists
# only for a future self-hosted/VPS deployment, alongside
# docker-compose.prod.yml.
#
# Usage: point this at your backend container/service and drop it into
# an nginx instance (or the `nginx:alpine` image) in front of it. Replace
# `your-domain.com` and the TLS cert paths before use.

upstream leadboost_backend {
    server backend:8000;
    keepalive 32;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Matches the security headers already set at the application level
    # (see main.py's add_security_headers middleware) -- kept here too
    # since nginx is the outermost layer in this topology and should not
    # depend on the app behind it to set them correctly.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 10M;

    # Basic request-rate limiting at the edge, in front of the
    # application's own per-account usage-limit enforcement -- protects
    # against sheer request volume (e.g. credential-stuffing against
    # /login) rather than plan quotas.
    limit_req_zone $binary_remote_addr zone=leadboost_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=leadboost_auth:10m rate=5r/m;

    location /api/v2/login {
        limit_req zone=leadboost_auth burst=5 nodelay;
        proxy_pass http://leadboost_backend;
        include /etc/nginx/proxy_params_leadboost.conf;
    }

    location /api/v2/register {
        limit_req zone=leadboost_auth burst=5 nodelay;
        proxy_pass http://leadboost_backend;
        include /etc/nginx/proxy_params_leadboost.conf;
    }

    location /metrics {
        # Prometheus scraping only -- restrict to the monitoring
        # network/host, never expose publicly.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://leadboost_backend;
        include /etc/nginx/proxy_params_leadboost.conf;
    }

    location / {
        limit_req zone=leadboost_general burst=40 nodelay;
        proxy_pass http://leadboost_backend;
        include /etc/nginx/proxy_params_leadboost.conf;
    }

    location /health {
        proxy_pass http://leadboost_backend;
        include /etc/nginx/proxy_params_leadboost.conf;
        access_log off;
    }
}

# Save alongside this file as proxy_params_leadboost.conf and reference
# via `include` above (kept separate so it's easy to reuse across
# location blocks without repeating every directive).
