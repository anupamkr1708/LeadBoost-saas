[pytest]
asyncio_mode = auto
testpaths = tests
# tests/scraper/ holds standalone verification scripts meant to be run
# directly with `python` (see that directory's own docstrings and
# README.md's Testing section), not collected by pytest -- they execute
# module-level `asyncio.run(main())` calls against a legacy top-level
# `scraper` module that does not resolve in this package layout, which
# previously made a bare `pytest` invocation (as opposed to the
# documented `pytest tests/ --ignore=tests/scraper`) abort at collection
# with zero tests run. norecursedirs keeps pytest from ever walking into
# that directory, so the documented behavior is the actual default
# behavior and the standalone scripts are left untouched.
norecursedirs = tests/scraper .git .venv venv node_modules
