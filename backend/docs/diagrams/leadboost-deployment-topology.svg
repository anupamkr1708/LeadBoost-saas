<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 905" width="1100" height="905" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">LeadBoost + Mailer deployment topology</title><desc id="d">Deployment topology with separate services and separate databases: a Next.js frontend service; one LeadBoost backend process running the API and the in-process job loop, with its own PostgreSQL; a Mailer API service and exactly one Mailer worker service sharing the Mailer's own PostgreSQL. Provider-neutral.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ws" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="es" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs>
<rect width="1100" height="905" fill="#FFFFFF"/>
<text x="10" y="26" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Deployment topology: separate services, separate databases</text>
<text x="10" y="44" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Provider-neutral. Hostnames, regions and the hosting provider are intentionally not recorded in this repository.</text>
<rect x="10" y="70" width="160" height="40" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
<text x="90.0" y="90" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle">User's browser</text>
<rect x="10" y="150" width="160" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="90.0" y="170" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">Frontend service</text>
<text x="90.0" y="187.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">Next.js 14 build</text>
<text x="90.0" y="201.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">NEXT_PUBLIC_API_URL is</text>
<text x="90.0" y="216.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">baked in at build time</text>
<text x="90.0" y="230.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">(LeadBoost backend URL)</text>
<path d="M90,110 L90,150" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="101.0" y="121.0" width="46.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="124.0" y="134.0" font-size="11.5" font-weight="500" fill="#111827" text-anchor="middle">HTTPS</text>
<rect x="230" y="60" width="330" height="575" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<path d="M230,72 a12,12 0 0 1 12,-12 h306 a12,12 0 0 1 12,12 v14 h-330 z" fill="#DBEAFE" stroke="none"/>
<line x1="230" y1="86" x2="560" y2="86" stroke="#2563EB" stroke-width="1"/>
<text x="242" y="78" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="start">LeadBoost</text>
<text x="548" y="78" font-size="11.5" font-weight="400" fill="#1E3A8A" text-anchor="end">one deployable</text>
<rect x="245" y="100" width="300" height="200" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="395.0" y="120" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">Backend service (single process)</text>
<text x="395.0" y="137.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">uvicorn --workers 1: API and the</text>
<text x="395.0" y="151.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">in-process job loop in one process</text>
<text x="395.0" y="166.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">JOB_WORKER_ENABLED=true (default)</text>
<text x="395.0" y="180.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle"></text>
<text x="395.0" y="195.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">ENVIRONMENT, SECRET_KEY, DATABASE_URL,</text>
<text x="395.0" y="209.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">ALLOWED_ORIGINS (no * in production)</text>
<text x="395.0" y="224.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">EMAIL_CREDENTIAL_ENCRYPTION_KEY</text>
<text x="395.0" y="238.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">MAILING_AGENT_BASE_URL (https)</text>
<text x="395.0" y="253.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">MAILING_AGENT_ORG_API_KEYS (secret)</text>
<path d="M170,205 L245,205" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="184.5" y="183.0" width="46.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="207.5" y="196.0" font-size="11.5" font-weight="500" fill="#111827" text-anchor="middle">HTTPS</text>
<path d="M245,368 v64 a150.0,8 0 0 0 300,0 v-64 a150.0,8 0 0 0 -300,0 z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<ellipse cx="395.0" cy="368" rx="150.0" ry="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="395.0" y="390" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">LeadBoost PostgreSQL</text>
<text x="395.0" y="406" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">leads · jobs · email accounts · actions</text>
<path d="M395,300 L395,360" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#as)"/>
<rect x="401.0" y="321.0" width="36.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="419.0" y="334.0" font-size="11.5" font-weight="500" fill="#111827" text-anchor="middle">SQL</text>
<rect x="245" y="470" width="300" height="80" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="255" y="488" font-size="12" font-weight="700" fill="#1F2937" text-anchor="start">Migrations</text>
<text x="255" y="505" font-size="11" font-weight="400" fill="#111827" text-anchor="start">alembic upgrade head runs as its own</text>
<text x="255" y="520" font-size="11" font-weight="400" fill="#111827" text-anchor="start">release step, once per deploy, never in</text>
<text x="255" y="535" font-size="11" font-weight="400" fill="#111827" text-anchor="start">app startup. Back up and verify first.</text>
<rect x="245" y="575" width="300" height="48" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
<text x="395.0" y="595" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">External: search, LLM, sites</text>
<text x="395.0" y="612.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">Overpass · Serper · Groq · business websites</text>
<rect x="660" y="60" width="430" height="575" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
<path d="M660,72 a12,12 0 0 1 12,-12 h406 a12,12 0 0 1 12,12 v14 h-430 z" fill="#D1FAE5" stroke="none"/>
<line x1="660" y1="86" x2="1090" y2="86" stroke="#059669" stroke-width="1"/>
<text x="672" y="78" font-size="13" font-weight="700" fill="#065F46" text-anchor="start">Mailer Agent</text>
<text x="1078" y="78" font-size="11.5" font-weight="400" fill="#065F46" text-anchor="end">separate repository</text>
<rect x="675" y="100" width="400" height="165" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="875.0" y="120" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">API service</text>
<text x="875.0" y="137.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">gunicorn, 2 uvicorn workers; no scheduler</text>
<text x="875.0" y="151.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">RUN_SCHEDULER_IN_PROCESS=false</text>
<text x="875.0" y="166.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">ORG_KEY_MAP (secret): API key maps to organization</text>
<text x="875.0" y="180.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">SYSTEM_OPERATOR_API_KEY (secret, differs)</text>
<text x="875.0" y="195.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">LEADBOOST_INTEGRATION_SENDER_EMAIL</text>
<text x="875.0" y="209.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">API_DOCS_ENABLED=false (default)</text>
<path d="M675,308 v64 a200.0,8 0 0 0 400,0 v-64 a200.0,8 0 0 0 -400,0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<ellipse cx="875.0" cy="308" rx="200.0" ry="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<text x="875.0" y="330" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Mailer PostgreSQL</text>
<text x="875.0" y="346" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">its own database; never LeadBoost's</text>
<rect x="675" y="420" width="400" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="875.0" y="440" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Worker service (exactly one instance)</text>
<text x="875.0" y="457.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">python worker.py: APScheduler jobs</text>
<text x="875.0" y="471.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">generation · send · lease recovery · IMAP poll</text>
<text x="875.0" y="486.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">LIVE_SENDING_ENABLED gates real SMTP sends</text>
<text x="875.0" y="500.5" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">AUTO_REPLY_ENABLED (no effect on LeadBoost contacts)</text>
<text x="875.0" y="515.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">SIGTERM: drain sends, then SENDING -&gt; UNKNOWN</text>
<path d="M875,265 L875,300" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#as)"/>
<rect x="881.0" y="273.5" width="36.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="899.0" y="286.5" font-size="11.5" font-weight="500" fill="#111827" text-anchor="middle">SQL</text>
<path d="M875,420 L875,380" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#as)"/>
<rect x="881.0" y="391.0" width="36.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="899.0" y="404.0" font-size="11.5" font-weight="500" fill="#111827" text-anchor="middle">SQL</text>
<path d="M545,150 L675,150" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="587.0" y="128.0" width="46.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="610.0" y="141.0" font-size="11.5" font-weight="500" fill="#111827" text-anchor="middle">HTTPS</text>
<path d="M545,182 L675,182" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="575.0" y="188.0" width="70.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="610.0" y="201.0" font-size="11.5" font-weight="500" fill="#111827" text-anchor="middle">X-API-Key</text>
<rect x="660" y="665" width="130" height="50" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
<text x="725.0" y="685" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">LLM provider</text>
<text x="725.0" y="702.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">Mailer's own key</text>
<rect x="805" y="665" width="130" height="50" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
<text x="870.0" y="685" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">SMTP server</text>
<text x="870.0" y="702.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">STARTTLS</text>
<rect x="950" y="665" width="130" height="50" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
<text x="1015.0" y="685" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">IMAP mailbox</text>
<text x="1015.0" y="702.0" font-size="11" font-weight="400" fill="#111827" text-anchor="middle">IMAPS poll</text>
<path d="M725,570 L725,665" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M870,570 L870,665" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M1015,665 L1015,570" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="10" y="745" width="530" height="118" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="20" y="763" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="start">Must agree or stay stable (LeadBoost side)</text>
<text x="20" y="780" font-size="11" font-weight="400" fill="#111827" text-anchor="start">MAILING_AGENT_ORG_API_KEYS {org_id: key} and ORG_KEY_MAP {key: org_id}</text>
<text x="20" y="795" font-size="11" font-weight="400" fill="#111827" text-anchor="start">must agree for every LeadBoost organization.</text>
<text x="20" y="810" font-size="11" font-weight="400" fill="#111827" text-anchor="start">Keep stable across restarts and rollbacks:</text>
<text x="20" y="825" font-size="11" font-weight="400" fill="#111827" text-anchor="start">SECRET_KEY, EMAIL_CREDENTIAL_ENCRYPTION_KEY, DATABASE_URL and</text>
<text x="20" y="840" font-size="11" font-weight="400" fill="#111827" text-anchor="start">the key-map entries. Changing the first two orphans stored data.</text>
<rect x="560" y="745" width="530" height="118" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="570" y="763" font-size="12" font-weight="700" fill="#065F46" text-anchor="start">Must match or stay single (Mailer side)</text>
<text x="570" y="780" font-size="11" font-weight="400" fill="#111827" text-anchor="start">Identical on API and worker: DATABASE_URL, MAILBOX_ENCRYPTION_KEY.</text>
<text x="570" y="795" font-size="11" font-weight="400" fill="#111827" text-anchor="start">The encryption key is not shared with LeadBoost; losing it makes</text>
<text x="570" y="810" font-size="11" font-weight="400" fill="#111827" text-anchor="start">stored mailbox credentials unreadable (keep an offline backup).</text>
<text x="570" y="825" font-size="11" font-weight="400" fill="#111827" text-anchor="start">Keep exactly one worker: it owns the scheduler. Pause sending by</text>
<text x="570" y="840" font-size="11" font-weight="400" fill="#111827" text-anchor="start">suspending the worker, not by flipping LIVE_SENDING_ENABLED.</text>
<rect x="10" y="880" width="16" height="12" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="32" y="890" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">LeadBoost</text>
<rect x="111.6" y="880" width="16" height="12" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<text x="133.6" y="890" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">Mailer</text>
<rect x="194.0" y="880" width="16" height="12" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
<text x="216.0" y="890" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">External / operational</text>
</svg>
