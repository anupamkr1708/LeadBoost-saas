<text x="210" y="746" font-size="11" font-weight="400" fill="#111827" text-anchor="start">Separate repositories, deployments and databases: no shared ORM models, transaction or encryption key.</text>
<text x="210" y="761" font-size="11" font-weight="400" fill="#111827" text-anchor="start">Credentials that cross: the per-organization API key on every call; an SMTP credential only during mailbox provisioning.</text>
<text x="210" y="776" font-size="11" font-weight="400" fill="#111827" text-anchor="start">The browser never receives a Mailer URL or key.</text>
