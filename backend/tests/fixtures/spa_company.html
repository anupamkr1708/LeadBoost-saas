<script>

  ld.text = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Nimbus Cloud Storage",
    "foundingDate": "2018-01-01",
    "sameAs": ["https://www.linkedin.com/company/nimbuscloud"],
    "contactPoint": [{"@type":"ContactPoint","contactType":"sales","email":"sales@nimbuscloud.io"}]
  });
  document.head.appendChild(ld);

  document.getElementById('root').innerHTML =
    '<nav><a href="/about">About</a><a href="/contact">Contact</a><a href="/careers">Careers</a></nav>' +
    '<main><h1>Nimbus Cloud Storage</h1>' +
    '<p>Founded in 2018, Nimbus now serves over 4,000 customers worldwide with encrypted, ' +
    'zero-knowledge cloud backup. Email us at hello@nimbuscloud.io or call (415) 555-0142.</p></main>';
}, 300);
