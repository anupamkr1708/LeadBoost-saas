# Prometheus configuration for LeadBoost.
#
# Scrapes the backend's own /metrics endpoint (see
# core/observability/prometheus_metrics.py) plus itself. Add
# postgres_exporter / redis_exporter jobs here if/when those are added --
# neither is included by default to keep the base monitoring stack
# minimal and because the backend's own metrics already cover the
# request/auth/discovery/pipeline numbers this brief asks for.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "leadboost-backend"
    metrics_path: /metrics
    # /metrics is owner/operator-only: the backend answers 403 unless METRICS_BEARER_TOKEN
    # is configured, and 401 unless this exact token is presented. The token is read from a
    # file (never written into this config); docker-compose.prod.yml mounts it from
    # ./monitoring/secrets/metrics_bearer_token as the `metrics_bearer_token` secret. See
    # docs/MONITORING.md for how the operator creates that file.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "leadboost-backend"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
