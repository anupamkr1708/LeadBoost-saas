# Alembic configuration for LeadBoost SaaS.
#
# No database URL is set here on purpose: alembic/env.py reads DATABASE_URL
# from the environment the same way core/infrastructure/database/__init__.py
# already does, so this file never needs to (and must never) contain a real
# connection string, credential, or secret. See alembic/env.py.

[alembic]
script_location = %(here)s/alembic

# Match the naming convention Alembic recommends for readable, chronological
# `alembic history` output.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os


[post_write_hooks]
# Not used. Formatting/linting of generated revisions is done by hand during
# the mandatory manual review step (see docs/DEPLOYMENT.md's "Creating a
# migration" section) rather than automatically -- reviewing the raw
# autogenerate output, unmodified, is part of what that review step checks.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
