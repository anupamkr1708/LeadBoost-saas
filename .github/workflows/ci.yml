name: CI

# Validates every push/PR -- formatting, lint, type-checking, tests,
# Docker build, and a dependency security scan. Never deploys anything;
# SECTION 6 of the brief is explicit that this pipeline validates only.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  python-quality:
    name: Python formatting, lint, type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy

      # These three run in report-only mode (continue-on-error) rather
      # than blocking merges: this pipeline is being added to an
      # existing, already-working codebase that wasn't developed against
      # any of these tools, and the brief is explicit about polishing
      # rather than mass-rewriting working code to satisfy a new style
      # guide. They still surface every finding in the Actions log/
      # annotations so issues are visible and can be cleaned up
      # incrementally. Promote any of these to a hard gate (drop
      # continue-on-error) once the codebase is clean under it.
      - name: Black (formatting check)
        continue-on-error: true
        run: black --check --diff .

      - name: Ruff (lint)
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Mypy (type check)
        continue-on-error: true
        run: mypy . || true

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install Playwright browser (chromium only)
        run: playwright install --with-deps chromium

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          SECRET_KEY: "ci-test-secret-not-for-production-use-only"
          ENVIRONMENT: "development"
        run: |
          pytest tests/ discovery_eval/tests/ -v \
            --ignore=tests/scraper \
            --junitxml=test-results.xml
          # tests/scraper/ is intentionally excluded, not deselected test
          # by test: those files (test_orchestration.py, test_parsing.py,
          # test_playwright.py) are standalone dev scripts left over from
          # the scraper rewrite -- they execute via asyncio.run(...) at
          # import time, use a global PASS/FAIL counter with print()
          # instead of assert, and expect to be run directly with a
          # scraper.py on sys.path (`import scraper as S`), not collected
          # by pytest. They are not broken by anything in this pass; they
          # were simply never pytest-shaped. Converting them into real
          # pytest tests (or moving them beside scripts/test_scraper.py,
          # which is the same style of standalone script) is future work,
          # not done here.
          #
          # tests/infrastructure/test_scraper.py previously had 3 tests
          # deselected here because _parse_json_ld/_pick_priority_subpages
          # no longer existed under those names. Both are now rewritten
          # against the current two-stage JSON-LD pipeline
          # (_extract_json_ld_blocks/_semantic_from_jsonld_blocks) and the
          # weighted _discover_candidate_pages ranking, and pass -- so
          # nothing is deselected here anymore.
          #
          # discovery_eval/tests/ (Discovery Quality Refinement sprint) is
          # added explicitly alongside tests/ -- pytest.ini's
          # `testpaths = tests` only applies when pytest is invoked with
          # no path argument, so it has no effect once a path is given
          # here, and discovery_eval/ sits outside `tests/` by design (it
          # is a standalone, importable evaluation package with its own
          # README, not part of the test tree). Its tests
          # (discovery_eval/tests/test_discovery_eval.py) are pure-logic
          # unit tests for the eval harness itself (metrics aggregation,
          # CSV/JSON/Markdown report generation, chart generation against
          # matplotlib) using no-op duck-typed stubs -- see that file's own
          # docstring -- so they need no DB, no network, and no provider
          # API keys, unlike `discovery_eval.run_eval` itself (the actual
          # benchmark harness), which is never invoked in CI: it makes
          # live calls to the production Discovery pipeline's real search
          # providers and is meant to be run manually/on demand by a
          # developer with the relevant API keys set, not on every PR.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          # defaults.run.working-directory only applies to `run` steps,
          # not to `uses` steps -- pytest above writes this file inside
          # backend/ (via the working-directory default), so the
          # upload-artifact path must point there explicitly or the file
          # won't be found. Behaviour of this step is otherwise unchanged.
          path: backend/test-results.xml
          retention-days: 14

  security-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      # Report-only: a known-CVE transitive dependency shouldn't silently
      # block every PR with no path to merge while a fix is pending
      # upstream, but it must be visible. Flip to a hard failure (drop
      # `|| true`) once you want this to gate merges.
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt || true

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (validation only, never pushed)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: leadboost-backend:ci-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    # This backend repository doesn't include frontend source, so this
    # job no-ops gracefully rather than failing when ../frontend or a
    # sibling frontend/ directory isn't present -- wire the real
    # `working-directory: frontend` path in once the frontend project is
    # part of this repo (or a separate workflow in that repo, if it lives
    # elsewhere).
    steps:
      - uses: actions/checkout@v4

      - name: Check for frontend directory
        id: check
        run: |
          if [ -d "frontend-react" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend-react/ directory in this repo -- skipping frontend lint/build."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        if: steps.check.outputs.present == 'true'
        working-directory: frontend-react
        run: npm ci

      - name: Lint frontend
        if: steps.check.outputs.present == 'true'
        working-directory: frontend-react
        run: npm run lint

      - name: Build frontend
        if: steps.check.outputs.present == 'true'
        working-directory: frontend-react
        run: npm run build